<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>The brand shop</title>
  </head>
  <body>
    <!-- Хэдэр -->
    <header class="header center">
      <!-- Логотип и поиск -->
      <div class="header__logo">
        <a href="#"><img src="img/logo.svg" alt="logo" /></a>
        <img src="img/icon_search.svg" alt="search" />
      </div>
      <!-- Правое меню -->
      <div class="header__menu">
        <a href="#"><img src="img/icon_menu.svg" alt="heart" /></a>
        <a href="#"><img src="img/icon_login.svg" alt="login" /></a>
        <a href="#"><img src="img/icon_basket.svg" alt="basket" /></a>
      </div>
    </header>
    <!-- Главный экран -->
    <section class="main center">
      <div class="main__content">
        <div class="main__photo">
          <img src="img/main_photo.png" alt="main photo" />
        </div>
        <div class="main__info">
          <img src="img/main_red-line.svg" alt="red line" />
          <p>
            <span class="the_brand">THE BRAND</span><br /><span
              class="of_luxerious"
              >OF LUXERIOUS </span
            ><span class="fashion">FASHION</span>
          </p>
        </div>
      </div>
    </section>

    <!-- Разделы каталога -->
    <section class="catalog center">
      <div class="catalog__wear">
        <!-- FOR WOMEN -->
        <article class="catalog__women">
          <img src="img/for women.jpg" alt="women" />
          <p class="catalog__text">
            30% OFF
            <br />
            <span>FOR WOMEN</span>
          </p>
        </article>
        <!-- FOR MEN -->
        <article class="catalog__men">
          <img src="img/for men.jpg" alt="men" />
          <p class="catalog__text">
            HOT DEAL
            <br />
            <span>FOR MEN</span>
          </p>
        </article>
        <!-- FOR KIDS -->
        <article class="catalog__kids">
          <img src="img/for kids.jpg" alt="kids" />
          <p class="catalog__text">
            NEW ARRIVALS
            <br />
            <span>FOR KIDS</span>
          </p>
        </article>
      </div>
      <!-- ACCESSORIES -->
      <article class="catalog__accessories">
        <img src="img/accesories.jpg" alt="accessories" />
        <p class="catalog__text">
          LUXIROUS & TRENDY
          <br />
          <span>ACCESSORIES</span>
        </p>
      </article>
    </section>
  </body>
</html>
